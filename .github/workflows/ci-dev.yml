name: CI – dev

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read
  packages: write

jobs:
  docker-build:
    name: Build & push Docker image (dev)
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Node setup ────────────────────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. Install dependencies ───────────────────────────────────────────────
      - name: Install dependencies (npm ci)
        run: npm ci --prefer-offline
        env:
          npm_config_loglevel: verbose

      # ── 4. Lint ───────────────────────────────────────────────────────────────
      - name: Lint
        id: lint
        run: npm run lint 2>&1 | tee lint-output.txt
        continue-on-error: true

      - name: Upload lint log on failure
        if: steps.lint.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: lint-errors-${{ github.sha }}
          path: lint-output.txt
          retention-days: 7

      - name: Fail if lint failed
        if: steps.lint.outcome == 'failure'
        run: |
          echo "::error title=Lint failed::ESLint found errors. Download the 'lint-errors-${{ github.sha }}' artifact for details."
          exit 1

      # ── 5. Build ──────────────────────────────────────────────────────────────
      - name: Build (nest build)
        id: build
        run: npm run build 2>&1 | tee build-output.txt
        continue-on-error: true

      - name: Upload build log on failure
        if: steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: build-errors-${{ github.sha }}
          path: build-output.txt
          retention-days: 7

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error title=Build failed::TypeScript compilation error. Download the 'build-errors-${{ github.sha }}' artifact for details."
          exit 1

      # ── 6. Set lowercase image name ──────────────────────────────────────────
      - name: Set image name (lowercase)
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/visionart-backend" >> $GITHUB_ENV

      # ── 7. Docker login ───────────────────────────────────────────────────────
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 8. Docker build & push ────────────────────────────────────────────────
      - name: Build & push Docker image
        id: docker
        uses: docker/build-push-action@v5
        with:
          context: .
          target: production
          push: true
          tags: |
            ${{ env.IMAGE }}:dev
            ${{ env.IMAGE }}:dev-${{ github.sha }}

      # ── 8. Summary ────────────────────────────────────────────────────────────
      - name: Write success summary
        if: success()
        run: |
          echo "## CI passed" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Install | OK |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | OK |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | OK |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker push | OK |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image**: \`${{ env.IMAGE }}:dev-${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Write failure summary
        if: failure()
        run: |
          echo "## CI failed" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Install | ${{ steps.lint.outcome == 'skipped' && 'FAILED' || 'OK' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ steps.lint.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ steps.build.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker | ${{ steps.docker.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Check the **Artifacts** section below the job for downloadable error logs." >> $GITHUB_STEP_SUMMARY
          echo "> Commit: \`${{ github.sha }}\` — pushed by **${{ github.actor }}**" >> $GITHUB_STEP_SUMMARY
