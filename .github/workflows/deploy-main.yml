name: Deploy – main

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      push_image:
        description: 'Push Docker image to registry'
        required: false
        default: 'false'
        type: boolean

jobs:
  deploy:
    name: Build · Test · Deploy (${{ github.event.inputs.environment }})
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: visionart_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_EXPIRES_IN: ${{ secrets.JWT_EXPIRES_IN || '7d' }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      DB_TYPE: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: rootpassword
      DB_DATABASE: visionart_db
      DB_SYNCHRONIZE: 'false'
      DB_LOGGING: 'false'

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test -- --passWithNoTests

      - name: Build Docker image
        run: |
          docker build --target production \
            -t visionart-backend:${{ github.event.inputs.environment }} \
            -t visionart-backend:${{ github.sha }} \
            .

      # ── Push to registry (only if opted-in) ──────────────────────────────
      # Uncomment and configure DOCKER_REGISTRY, DOCKER_USERNAME, DOCKER_TOKEN
      # secrets in GitHub repo settings when you're ready to push.
      #
      # - name: Login to registry
      #   if: ${{ github.event.inputs.push_image == 'true' }}
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ${{ secrets.DOCKER_REGISTRY }}
      #     username: ${{ secrets.DOCKER_USERNAME }}
      #     password: ${{ secrets.DOCKER_TOKEN }}
      #
      # - name: Push Docker image
      #   if: ${{ github.event.inputs.push_image == 'true' }}
      #   run: |
      #     docker push visionart-backend:${{ github.event.inputs.environment }}
      #     docker push visionart-backend:${{ github.sha }}

      - name: Summary
        run: |
          echo "## Deploy summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ github.event.inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
