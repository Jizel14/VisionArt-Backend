apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: visionart
spec:
  selector:
    app: visionart-backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: ClusterIP
---
# Expose externally (use LoadBalancer for cloud, NodePort for local k8s/minikube)
apiVersion: v1
kind: Service
metadata:
  name: backend-external
  namespace: visionart
spec:
  selector:
    app: visionart-backend
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
      nodePort: 30000
  type: NodePort
