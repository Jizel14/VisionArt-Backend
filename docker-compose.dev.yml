version: '3.9'

# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Overrides the backend service for local development:
#   - Uses dev build target (installs all deps including devDependencies)
#   - Mounts source code for hot reload via nest start --watch
#   - Sets NODE_ENV=development and DB_SYNCHRONIZE=true

services:
  backend:
    build:
      context: .
      target: builder
    command: npm run start:dev
    environment:
      NODE_ENV: development
      DB_SYNCHRONIZE: 'true'
      DB_LOGGING: 'true'
    volumes:
      - .:/app
      - /app/node_modules
